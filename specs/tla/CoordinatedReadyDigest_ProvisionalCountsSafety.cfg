SPECIFICATION Spec

\* MANUAL negative-result config (not auto-run): with the pre-#530
\* ProvisionalCounts rule the divergent lock is reachable (see
\* CoordinatedReadyDigest_ProvisionalCounts.cfg), but a strict-majority quorum
\* of three still cannot turn two divergent digests into two commits. TLC must
\* report: Model checking completed. No error has been found.
CONSTANT PARTICIPANTS = {0, 1, 2}
CONSTANT AUTHORITY = 0
CONSTANT FIX_MODE = "ProvisionalCounts"

INVARIANT TypeInvariant
INVARIANT AtMostOneCommittedDigest
INVARIANT CommittedHistoriesAgree
INVARIANT ProvisionalNeverCounts
INVARIANT ProvisionalNotCounted
INVARIANT ReadyAfterLock
