SPECIFICATION Spec

\* NON-VACUITY WITNESS (manual, not auto-run): checks the deliberately
\* falsifiable WitnessGoal, so TLC reports a counterexample once a latch, a
\* discarded cross-basis report, and an actual rewrite clear are all reachable.
\* Expected result: Invariant WitnessGoal is violated with a trace containing
\* "latched", "discarded", and "cleared".
CONSTANT PEERS = {0, 1}
CONSTANT MAX_FRAME = 1
CONSTANT FIX_MODE = "Basis"

INVARIANT WitnessGoal

CONSTRAINT LatchBound
CONSTRAINT EpochBound
CONSTRAINT ReportBound
