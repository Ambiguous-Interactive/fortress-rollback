SPECIFICATION Spec

\* DEMONSTRATION config (enforced expected-fail in verify-tla.sh): the
\* pre-#530 rule lets the first delivered Ready, from any participant, lock
\* the digest and count. A non-authority Ready carrying a divergent digest
\* therefore locks that digest (the #529 mechanism). TLC must report
\* LockedDigestAuthorized violated.
CONSTANT PARTICIPANTS = {0, 1, 2}
CONSTANT AUTHORITY = 0
CONSTANT FIX_MODE = "ProvisionalCounts"

INVARIANT TypeInvariant
INVARIANT LockedDigestAuthorized
