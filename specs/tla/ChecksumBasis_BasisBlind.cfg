SPECIFICATION Spec

\* DEMONSTRATION config (enforced expected-fail in verify-tla.sh): the pre-#563
\* additive multiset keeps every recorded boundary, so two peers converged at
\* the same boundary can still derive different tokens. TLC must report
\* NoPermanentFalseNegative violated (the #562 permanent false negative).
CONSTANT PEERS = {0, 1}
CONSTANT MAX_FRAME = 1
CONSTANT FIX_MODE = "BasisBlind"

INVARIANT TypeInvariant
INVARIANT NoPermanentFalseNegative

CONSTRAINT LatchBound
CONSTRAINT EpochBound
CONSTRAINT ReportBound
