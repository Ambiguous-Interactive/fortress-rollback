[package]
name = "fortress-godot-probe"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = []
nothreads = ["godot/experimental-wasm-nothreads"]

[dependencies]
fortress-rollback = { path = "../..", features = ["hot-join", "test-probes"] }
fortress-replay-fixture = { path = "../replay-fixture", features = ["hot-join"] }
godot = { version = "=0.5.6", features = ["api-4-7", "experimental-wasm", "lazy-function-tables"] }
web-time = "1.1"
