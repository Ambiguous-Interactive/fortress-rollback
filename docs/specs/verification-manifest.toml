# Code-to-verification manifest (schema 1).
#
# Each [[component]] maps production paths and symbols to the TLA+ specs,
# Kani harnesses, Z3 proofs, and Rust tests that keep it honest.
# `scripts/verification/model-impact.py` validates this file and maps diffs to
# components; a mapped code change needs a mapped spec/proof/test update in the
# same diff or an explicit [[waiver]].
#
# status:
#   modeled   - a model and/or executable proof covers the component
#   bounded   - a model covers a bounded configuration only
#   unmodeled - no model or proof exists yet; changes need a waiver
#   stale     - the model predates current behavior; changes need a waiver
#
# TLA check names derive from the spec file stems (a `*Trace.tla` spec maps to
# its registered `<stem>Contract` check). Symbols are advisory `path::name`
# definitions; paths, specs, harnesses, proofs, and tests fail closed.
# Expired residual review_by dates fail the check so the gap is re-triaged.

schema_version = 1

