name: CI - PR Gate

# Fast, high-signal gate for pull requests and merge-queue candidates.
# Deep assurance runs on merge_group/nightly workflows.

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Decide whether the cfg(kani) compile gate is relevant. Rust source and
  # build inputs can break the Kani-only tree; docs/CI-only PRs skip the
  # expensive tool install. Any detection failure fails closed (runs the gate).
  changes:
    name: Detect Kani-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kani: ${{ steps.diff.outputs.kani }}

    steps:
      - uses: actions/checkout@v7

      - name: Classify changed paths
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash scripts/ci/detect-kani-changes.sh

  fast:
    name: Fast Gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable snapshot
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-nextest

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: pr-fast

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features tokio,json -- -D warnings

      - name: Run full Linux test suite
        run: cargo nextest run --profile ci --features tokio,json

      - name: Response-time budget note
        run: 'echo "Fast gate target: under 10 minutes wall time."'

  # `cargo kani --only-codegen` type-checks the real cfg(kani) tree (the
  # stack-backed ProofVec shim and every `#[cfg(kani)]` module) without running
  # any proof. PR #427 merged a by-reference `ProofVec` iteration that clippy,
  # tests, and rustdoc all accept but the Kani tiers could not compile; this
  # check catches that class of break in the required PR gate.
  kani-compile:
    name: Kani cfg Compile
    needs: changes
    if: needs.changes.outputs.kani == 'true'
    runs-on: ubuntu-latest
    # Install retry budget is 3 x 10 min + 2 x 60 s, then an 8 min codegen
    # ceiling; the job timeout must exceed that so a slow install is retried
    # instead of being killed mid-attempt.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Setup Kani
        uses: ./.github/actions/setup-kani
        with:
          install-timeout-minutes: '10'

      - name: Type-check the cfg(kani) tree
        run: cargo kani --only-codegen
        timeout-minutes: 8

  api-census:
    name: Public API Census
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust nightly
        id: nightly
        uses: ./.github/actions/install-pinned-nightly

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: pr-api-census-${{ steps.nightly.outputs.toolchain }}
          cache-paths: |
            ~/.cargo/registry
            ~/.cargo/git
            target/public-api-census

      - name: Verify checked public API snapshot
        run: python3 scripts/api/public_api_census.py --check

  wasm-check:
    name: WASM Compile Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain with WASM targets
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable snapshot
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown,wasm32-unknown-emscripten
          components: clippy

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: pr-wasm

      - name: Check wasm32-unknown-unknown
        run: cargo check --target wasm32-unknown-unknown --no-default-features

      - name: Check browser runtime test crate
        run: cargo check -p wasm-browser-smoke --features hot-join --target wasm32-unknown-unknown --lib --tests

      - name: Check wasm32-unknown-emscripten
        run: cargo check --target wasm32-unknown-emscripten --no-default-features

      - name: Reject browser-only dependencies on Emscripten
        run: ./scripts/ci/check-emscripten-dependencies.sh

  session-budget:
    name: Session Budget
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the trusted base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: base
          fetch-depth: 1

      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 1

      - name: Enforce the rolling three-hour, two-PR window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(printf '%s' "$MERGE_GROUP_HEAD_REF" | sed -n 's/.*pr-\([0-9][0-9]*\)-.*/\1/p')"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "cannot resolve the pull request number for the session budget" >&2
            exit 1
          fi
          if [ -f base/scripts/ci/check-session-pr-budget.py ]; then
            TRUSTED_SCRIPT=base/scripts/ci/check-session-pr-budget.py
            echo "Running the base-branch session budget checker at $BASE_SHA"
          else
            TRUSTED_SCRIPT=pr/scripts/ci/check-session-pr-budget.py
            echo "::warning::the base branch has no session budget checker; bootstrap uses the PR copy"
          fi
          python3 "$TRUSTED_SCRIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER"

  gate:
    name: CI Gate
    needs: [changes, fast, api-census, wasm-check, kani-compile, session-budget]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every PR gate dependency to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -e '
            all(.[];
              .result == "success" or .result == "skipped" or .result == "neutral"
            )
          '
